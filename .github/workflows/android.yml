name: Build Android APK

on:
  push:
    branches: [main, void-frontier]
    tags: ['v*', 'void-frontier-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-tests:
    name: Web tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: JS syntax check
        run: npm run check
      - name: Install Playwright
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Regression tests
        run: |
          python3 -m http.server 8081 -d www > /dev/null 2>&1 &
          sleep 2
          VF_OUT=shots python3 tests/full.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-screenshots, path: shots/, retention-days: 7 }

  apk:
    name: Build APK
    needs: web-tests
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK (preinstalled on runner)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > "$RUNNER_TEMP/local.properties"
          ls "$SDK" || true
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SM" ]; then yes | "$SM" --licenses > /dev/null || true; fi
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: npx cap add android
      - name: Configure Android project
        env:
          VERSION_NAME: 2.0.${{ github.run_number }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: bash tools/android_setup.sh
      - name: Sync web assets
        run: |
          npx cap sync android
          cp "$RUNNER_TEMP/local.properties" android/local.properties
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Build signed release APK (only if keystore secret exists)
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/VOID_FRONTIER_2.0.${{ github.run_number }}_debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then cp android/app/build/outputs/apk/release/app-release.apk dist/VOID_FRONTIER_2.0.${{ github.run_number }}_release.apk; fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: VOID_FRONTIER_APK
          path: dist/*.apk
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/void-frontier'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('void-frontier-v2.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: dist/*.apk
          name: VOID FRONTIER 2.0.${{ github.run_number }}
          body: |
            VOID FRONTIER 2.0 — APK для Android (debug-подпись, установка «из неизвестных источников»).
            Подробности: README.md и CHANGELOG.md в ветке void-frontier.
